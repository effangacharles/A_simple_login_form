<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Sign in to your account."
    />
    <title>Sign in</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="page">
      <section class="login-card" aria-labelledby="login-title">
        <a class="brand" href="#" aria-label="Northstar home">
          <span class="brand-mark" aria-hidden="true">N</span>
          <span>northstar</span>
        </a>

        <div class="intro">
          <p class="eyebrow">YOUR SPACE, YOUR PACE</p>
          <h1 id="login-title">Welcome back</h1>
          <p class="intro-copy">Sign in to pick up right where you left off.</p>
        </div>

        <form class="login-form" action="#" method="post">
          <div class="field">
            <label for="email">Email address</label>
            <input
              id="email"
              name="email"
              type="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            />
          </div>

          <div class="field">
            <div class="field-heading">
              <label for="password">Password</label>
              <a class="text-link" href="#">Forgot password?</a>
            </div>
            <input
              id="password"
              name="password"
              type="password"
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            />
          </div>

          <label class="remember">
            <input type="checkbox" name="remember" />
            <span class="checkmark" aria-hidden="true"></span>
            <span>Keep me signed in</span>
          </label>

          <button class="submit-button" type="submit">
            Sign in
            <span aria-hidden="true">→</span>
          </button>
        </form>

        <p class="signup">
          New to Northstar? <a class="text-link" href="#">Create an account</a>
        </p>

        <p class="privacy-note">
          By continuing, you agree to our
          <a href="#">Terms</a> and <a href="#">Privacy Policy</a>.
        </p>
      </section>
    </main>
  </body>
</html>
